name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Firebase (google-services.json)
        run: |
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "1070292426921",
              "project_id": "fleetpromanager-1991",
              "storage_bucket": "fleetpromanager-1991.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1070292426921:android:com.transportmanager.app",
                  "android_client_info": {
                    "package_name": "com.transportmanager.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1070292426921-qhasb3cm3v3skiqobdhfgpopk1c5rpb9.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAWqkAdzqXwPql2FnSKy6dOutDHLUx7CcY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK with Gradle
        run: |
          cd android
          # Ensure a fresh, non-corrupted gradle-wrapper.jar is always present
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy to Firebase App Distribution
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: appdistribution:distribute android/app/build/outputs/apk/debug/app-debug.apk --app "${{ secrets.FIREBASE_APP_ID_ANDROID || '1:1070292426921:android:com.transportmanager.app' }}" --groups "testers"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true
